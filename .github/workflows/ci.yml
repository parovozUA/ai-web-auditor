name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-eval:
    name: Quality and Evals (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Static Analysis - Ruff
        run: uv run ruff check .

      - name: Static Analysis - Mypy
        run: uv run mypy src/ tests/ scripts/

      - name: Unit & Integration Tests
        run: uv run pytest -m "not live" -v

      - name: Seeded Agent Evaluations
        run: uv run python scripts/run_evals.py

      - name: Package Build
        run: uv build

      - name: Upload Build Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/
          if-no-files-found: error
